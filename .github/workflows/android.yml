name: Build Android APK
on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test
      - run: npx playwright install --with-deps chromium
      - name: Mobile browser smoke tests
        run: |
          npm run dev &
          node scripts/browser-check.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable test APK and run Android lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OClock-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: android/app/build/reports/lint-results-debug.html
