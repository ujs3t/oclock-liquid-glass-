function refract(I,N,n1,n2){const eta=n1/n2,cosI=-(I.x*N.x+I.y*N.y),sin2T=eta*eta*(1-cosI*cosI);if(sin2T>1)return null;const cosT=Math.sqrt(1-sin2T);return {x:eta*I.x+(eta*cosI-cosT)*N.x,y:eta*I.y+(eta*cosI-cosT)*N.y};}
function dispAt(o){const x=clamp01(o.distancePx/o.bezelWidth),h=o.surfaceFn(x)*o.thickness,d=0.001;const x1=Math.max(0,x-d),x2=Math.min(1,x+d);const slope=((o.surfaceFn(x2)-o.surfaceFn(x1))/(x2-x1))*o.thickness/o.bezelWidth;let nx=-slope,nz=1;const len=Math.hypot(nx,nz)||1;nx/=len;nz/=len;const T=refract({x:0,y:-1},{x:nx,y:nz},1,o.refractiveIndex);if(!T||T.y===0)return 0;return (-h/T.y)*T.x;}
function buildProfile(o){const n=127,profile=new Array(n);let maxAbs=0;for(let i=0;i<n;i++){profile[i]=dispAt({distancePx:(i/(n-1))*o.bezelWidth,bezelWidth:o.bezelWidth,thickness:o.thickness,surfaceFn:o.surfaceFn,refractiveIndex:o.ior});maxAbs=Math.max(maxAbs,Math.abs(profile[i]));}return {profile,maxAbs:maxAbs||1e-6,bezelWidth:o.bezelWidth,samples:n};}
function sampleProfile(r,distPx){const c=clamp01(distPx/r.bezelWidth)*r.bezelWidth,p=(c/r.bezelWidth)*(r.samples-1);const i0=Math.floor(p),i1=Math.min(r.samples-1,i0+1),t=p-i0;return r.profile[i0]*(1-t)+r.profile[i1]*t;}
function edt1d(f,d,v,z,n){let k=0;v[0]=0;z[0]=-1e20;z[1]=1e20;for(let q=1;q<n;q++){let s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);while(s<=z[k]){k--;s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);}k++;v[k]=q;z[k]=s;z[k+1]=1e20;}k=0;for(let q=0;q<n;q++){while(z[k+1]<q)k++;const dx=q-v[k];d[q]=dx*dx+f[v[k]];}}
function edt2d(binary,w,h,targetVal){const INF=1e12;const grid=new Float32Array(w*h);for(let i=0;i<w*h;i++)grid[i]=(binary[i]===targetVal)?0:INF;const maxDim=Math.max(w,h);const f=new Float32Array(maxDim),d=new Float32Array(maxDim),v=new Int32Array(maxDim),z=new Float32Array(maxDim+1);for(let y=0;y<h;y++){const off=y*w;for(let x=0;x<w;x++)f[x]=grid[off+x];edt1d(f,d,v,z,w);for(let x=0;x<w;x++)grid[off+x]=d[x];}for(let x=0;x<w;x++){for(let y=0;y<h;y++)f[y]=grid[y*w+x];edt1d(f,d,v,z,h);for(let y=0;y<h;y++)grid[y*w+x]=Math.sqrt(d[y]);}return grid;}

function* computeGlassJob(alpha, w, h, ss, params) {
  const nPx = w * h;
  const binary = new Uint8Array(nPx);
  for (let i = 0; i < nPx; i++) binary[i] = alpha[i] >= 128 ? 1 : 0;
  const distOut = edt2d(binary, w, h, 1);
  yield;
  const distIn = edt2d(binary, w, h, 0);
  yield;
  const sdf = new Float32Array(nPx);
  let maxInside = 0;
  for (let i = 0; i < nPx; i++) {
    const s = distOut[i] > 0 ? (distOut[i] - 0.5) : -(distIn[i] - 0.5);
    sdf[i] = s;
    if (-s > maxInside) maxInside = -s;
  }
  const smooth = new Float32Array(nPx);
  for (let y = 0; y < h; y++) {
    const ym = y > 0 ? y - 1 : 0, yp = y < h - 1 ? y + 1 : h - 1;
    for (let x = 0; x < w; x++) {
      const xm = x > 0 ? x - 1 : 0, xp = x < w - 1 ? x + 1 : w - 1;
      smooth[y*w+x] = (sdf[ym*w+xm]+2*sdf[ym*w+x]+sdf[ym*w+xp]+2*sdf[y*w+xm]+4*sdf[y*w+x]+2*sdf[y*w+xp]+sdf[yp*w+xm]+2*sdf[yp*w+x]+sdf[yp*w+xp])*0.0625;
    }
    if (y % 32 === 31) yield;
  }
  const userBezelRaster = Math.max(2, params.bezel * ss);
  const bezelRaster = Math.max(2, Math.min(userBezelRaster, Math.max(2, 0.5 * maxInside)));
  const thickRaster = (params.thickness * ss) * (bezelRaster / userBezelRaster);
  const surfaceFn = SURFACES[params.surface] || SURFACES.convexSquircle;
  const radial = buildProfile({ bezelWidth: bezelRaster, thickness: thickRaster, ior: params.ior, surfaceFn });
  const dispData = new Uint8ClampedArray(nPx * 4);
  const shadData = new Uint8ClampedArray(nPx * 4);
  const shadThick = Math.max(1, params.shadowThickness * ss);
  const feather = Math.max(0.9, shadThick * 0.15);
  const radAngle = params.shadowAngle * Math.PI / 180;
  const ax = Math.cos(radAngle), ay = Math.sin(radAngle);
  for (let y = 0; y < h; y++) {
    const ym = y > 0 ? y - 1 : 0, yp = y < h - 1 ? y + 1 : h - 1;
    for (let x = 0; x < w; x++) {
      const xm = x > 0 ? x - 1 : 0, xp = x < w - 1 ? x + 1 : w - 1;
      const idx = y*w+x, p = idx*4, dd = sdf[idx];
      if (dd > feather) {
        dispData[p]=dispData[p+1]=dispData[p+2]=128; dispData[p+3]=255;
        continue;
      }
      const gx = (smooth[y*w+xp]-smooth[y*w+xm])*0.5;
      const gy = (smooth[yp*w+x]-smooth[ym*w+x])*0.5;
      const len = Math.hypot(gx,gy)||1;
      const nx = gx/len, ny = gy/len;
      if (dd > 0) {
        dispData[p]=dispData[p+1]=dispData[p+2]=128; dispData[p+3]=255;
      } else {
        const disp = sampleProfile(radial, Math.min(-dd, radial.bezelWidth));
        dispData[p]   = clamp255(128 - nx*(disp/radial.maxAbs)*127);
        dispData[p+1] = clamp255(128 - ny*(disp/radial.maxAbs)*127);
        dispData[p+2] = 128; dispData[p+3] = 255;
      }
      if (dd > feather || -dd > shadThick + feather) {
        shadData[p+3] = 0;
      } else {
        const edge = -dd;
        const band = clamp01((shadThick - edge) / shadThick);
        const sharp = Math.pow(band, 0.6);
        const edgeAA = clamp01((feather - dd) / (2 * feather));
        const k = Math.abs(nx*ax + ny*ay);
        shadData[p]=shadData[p+1]=shadData[p+2]=255;
        shadData[p+3]=clamp255(sharp*edgeAA*Math.pow(k,1.8)*255);
      }
    }
    if (y % 16 === 15) yield;
  }
  return { maxAbsCss: radial.maxAbs/ss, dispBuf: dispData.buffer, shadBuf: shadData.buffer };
}

/* inner-shadow map for the clock digits. Byte-for-byte the same painter the
   main thread uses; it just runs off-thread and encodes to a PNG blob there,
   so dragging the sliders never blocks a frame. */
function paintInnerShadow(alpha, w, h, cfg) {
  const cover = 2;
  const iw = Math.max(4, Math.round(w * cover));
  const ih = Math.max(4, Math.round(h * cover));
  const thickDev = Math.max(0.75, cfg.thickness * cfg.ss * cover * 0.5);
  const feather = Math.max(1.2, thickDev * 0.55);
  const ang = (cfg.angle * Math.PI) / 180;
  const ax = Math.cos(ang), ay = Math.sin(ang);
  const hex = (cfg.color || '#ffffff').replace('#', '');
  const cr = parseInt(hex.slice(0, 2), 16) || 255;
  const cg = parseInt(hex.slice(2, 4), 16) || 255;
  const cb = parseInt(hex.slice(4, 6), 16) || 255;

  const src = new OffscreenCanvas(w, h);
  const sx = src.getContext('2d');
  const im = sx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    im.data[i * 4] = 255; im.data[i * 4 + 1] = 255; im.data[i * 4 + 2] = 255;
    im.data[i * 4 + 3] = alpha[i];
  }
  sx.putImageData(im, 0, 0);

  const dcv = new OffscreenCanvas(iw, ih);
  const dg = dcv.getContext('2d', { willReadFrequently: true });
  dg.filter = 'blur(' + Math.max(0.05, thickDev * 0.5).toFixed(2) + 'px)';
  dg.drawImage(src, 0, 0, iw, ih);
  dg.filter = 'none';
  const dd = dg.getImageData(0, 0, iw, ih).data;

  const N = iw * ih;
  const a = new Float32Array(N);
  for (let i = 0; i < N; i++) a[i] = dd[i * 4 + 3];
  const out = new Uint8ClampedArray(N * 4);
  const fall = 1 / Math.max(1, feather * 2.2);
  for (let y = 0; y < ih; y++) {
    const ym = y > 0 ? y - 1 : 0, yp = y < ih - 1 ? y + 1 : ih - 1;
    for (let x = 0; x < iw; x++) {
      const xm = x > 0 ? x - 1 : 0, xp = x < iw - 1 ? x + 1 : iw - 1;
      const i = y * iw + x;
      const edge = 255 - a[i];
      if (edge <= 2) continue;
      const gx = (a[y * iw + xp] - a[y * iw + xm]) * 0.5;
      const gy = (a[yp * iw + x] - a[ym * iw + x]) * 0.5;
      if (gx === 0 && gy === 0) continue;
      const len = Math.hypot(gx, gy) || 1;
      const k = Math.abs((gx / len) * ax + (gy / len) * ay);
      const falloff = Math.pow(Math.min(1, edge * fall), 0.85);
      const q = i * 4;
      out[q] = cr; out[q + 1] = cg; out[q + 2] = cb;
      out[q + 3] = Math.pow(k, 1.6) * falloff * 255;
    }
  }
  const ocv = new OffscreenCanvas(iw, ih);
  const og = ocv.getContext('2d');
  og.putImageData(new ImageData(out, iw, ih), 0, 0);
  og.globalCompositeOperation = 'destination-in';
  og.drawImage(src, 0, 0, iw, ih);
  return ocv.convertToBlob({ type: 'image/png' });
}

self.onmessage = function (e) {
  if (e.data.kind === 'inner') {
    const jobId = e.data.jobId;
    paintInnerShadow(new Uint8Array(e.data.alphaBuf), e.data.w, e.data.h, e.data.cfg)
      .then((blob) => self.postMessage({ kind: 'inner', jobId, key: e.data.key, blob }));
    return;
  }
  const { jobId, alphaBuf, w, h, ss, params } = e.data;
  const alpha = new Uint8Array(alphaBuf);
  const it = computeGlassJob(alpha, w, h, ss, params);
  let r = it.next();
  while (!r.done) r = it.next();
  const res = r.value;
  // PNG compression belongs on the worker too, not on the animation thread.
  const sendBuffers = () => self.postMessage({ jobId, w, h, maxAbsCss: res.maxAbsCss,
    dispBuf: res.dispBuf, shadBuf: res.shadBuf }, [res.dispBuf, res.shadBuf]);
  if (typeof OffscreenCanvas !== 'undefined' && OffscreenCanvas.prototype.convertToBlob) {
    const encode = (buffer) => {
      const canvas = new OffscreenCanvas(w, h);
      canvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buffer), w, h), 0, 0);
      return canvas.convertToBlob({ type: 'image/png' });
    };
    Promise.all([encode(res.dispBuf), encode(res.shadBuf)]).then(([dispBlob, shadBlob]) => {
      self.postMessage({ jobId, w, h, maxAbsCss: res.maxAbsCss, dispBlob, shadBlob });
    }).catch(sendBuffers);
  } else sendBuffers();
};
`;

const Clock = (() => {
  const glassEl = $('clock-glass');
  const shadowEl = $('clock-shadow');
  const glowEl = $('clock-glow');
  const innerEl = $('clock-inner');
  const fbEl = $('clock-fb');
  const wrap = $('clock-wrap');

  let worker = null;
  let innerWorker = null;
  let workerUrl = null;
  let mainCore = null;
  let jobSeq = 0;
  let pendingMeta = new Map();
  let lastKey = '';
  let lastMinute = '';
  let rafPending = 0;
  let pos = { x: 0, y: 0 };

  function ensureWorker() {
    if (worker || typeof Worker === 'undefined') return worker;
    try {
      const blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
      workerUrl = URL.createObjectURL(blob);
      worker = new Worker(workerUrl);
      worker.onmessage = onWorkerResult;
      worker.onerror = () => { worker = null; resetInnerPost(); };
    } catch (e) { worker = null; }
    return worker;
  }

  /* A second thread for the digits' rim: the refraction job can occupy the
     main worker for a few hundred milliseconds, and the rim must never wait
     behind it (it is what the cross-fade depends on). */
  function ensureInnerWorker() {
    if (innerWorker || typeof Worker === 'undefined') return innerWorker;
    const base = ensureWorker();
    if (!base || !workerUrl) return null;
    try {
      innerWorker = new Worker(workerUrl);
      innerWorker.onmessage = (e) => { if (e.data && e.data.kind === 'inner') onInnerResult(e.data); };
      innerWorker.onerror = () => { innerWorker = null; resetInnerPost(); };
    } catch (e) { innerWorker = null; }
    return innerWorker;
  }

  function fontStack() {
    const f = state.font;
    if (f === 'SF') return '-apple-system,"SF Pro Display","Inter",system-ui,sans-serif';
    return `"${f}",-apple-system,"Inter",sans-serif`;
  }

  function getTime() {
    const d = new Date();
    let h = d.getHours();
    if (!state.hour24) { h = h % 12; if (h === 0) h = 12; }
    const pad = (n, l) => String(n).padStart(l, '0');
    const hh = state.hour24 && CONFIG.clock.leadingZero ? pad(h, 2) : String(h);
    const mm = pad(d.getMinutes(), 2);
    return { lines: [`${hh}:${mm}`], minuteKey: `${hh}:${mm}` };
  }

  /* ── INNER SHADOW, fast path ──────────────────────────────────────────────
     The old version ran a per-pixel loop over ~2M pixels on every rebuild,
     which is what made the sliders stutter. This one is pure canvas work
     (a few blur passes), and the finished map is cached by its parameters —
     moving the opacity slider now costs nothing at all. */
  let innerCache = { key: '', url: '' };
  let maskCache = { key: '', meta: null };
  /* Raster cache for the refraction/displacement image. Its inputs are the
     glyph alpha buffer + glass params only — so a re-tint or a re-layout can
     reuse the identical texture instead of running the whole SDF pass again. */
  let glassCache = { key: '', disp: '', shad: '', maxAbs: 0 };

  /* Inner-shadow map — the exact painter that was already approved:
     distance field → per-pixel edge normal → directional weight by the chosen
     angle → tint. Only the caching is new, so a repeat never re-runs the loop. */
  function innerShadowUrl(maskCanvas, w, h, ss, maskKey) {
    const cfg = CONFIG.glass.inner;
    if (!(cfg.thickness > 0)) return '';
    const key = [w, h, ss, maskKey || '', cfg.thickness, cfg.angle, cfg.color].join('|');
    if (innerCache.key === key) return innerCache.url;
    const url = paintInnerCpu(maskCanvas, w, h, ss, cfg);
    innerCache = { key, url };
    return url;
  }

  function paintInnerCpu(maskCanvas, w, h, ss, cfg) {
    const cover = 2;
    const iw = Math.max(4, Math.round(w * cover));
    const ih = Math.max(4, Math.round(h * cover));
    const thickDev = Math.max(0.75, cfg.thickness * ss * cover * 0.5);
    const feather = Math.max(1.2, thickDev * 0.55);
    const ang = (cfg.angle * Math.PI) / 180;
    const ax = Math.cos(ang), ay = Math.sin(ang);
    const hex = (cfg.color || '#ffffff').replace('#', '');
    const cr = parseInt(hex.slice(0, 2), 16) || 255;
    const cg = parseInt(hex.slice(2, 4), 16) || 255;
    const cb = parseInt(hex.slice(4, 6), 16) || 255;

    /* 1. distance-to-edge field, from a blurred copy of the silhouette */
    const dcv = document.createElement('canvas');
    dcv.width = iw; dcv.height = ih;
    const dg = dcv.getContext('2d', { willReadFrequently: true });
    dg.filter = `blur(${(thickDev * 0.5).toFixed(2)}px)`;
    dg.drawImage(maskCanvas, 0, 0, iw, ih);
    dg.filter = 'none';
    const dd = dg.getImageData(0, 0, iw, ih).data;

    /* 2. gradient of that field → per-pixel edge normal */
    const N = iw * ih;
    const a = new Float32Array(N);
    for (let i = 0; i < N; i++) a[i] = dd[i * 4 + 3];
    const out = new Uint8ClampedArray(N * 4);
    const fall = 1 / Math.max(1, feather * 2.2);
    for (let y = 0; y < ih; y++) {
      const ym = y > 0 ? y - 1 : 0, yp = y < ih - 1 ? y + 1 : ih - 1;
      for (let x = 0; x < iw; x++) {
        const xm = x > 0 ? x - 1 : 0, xp = x < iw - 1 ? x + 1 : iw - 1;
        const i = y * iw + x;
        const edge = 255 - a[i];
        if (edge <= 2) continue;
        const gx = (a[y * iw + xp] - a[y * iw + xm]) * 0.5;
        const gy = (a[yp * iw + x] - a[ym * iw + x]) * 0.5;
        if (gx === 0 && gy === 0) continue;
        const len = Math.hypot(gx, gy) || 1;
        const k = Math.abs((gx / len) * ax + (gy / len) * ay);
        const falloff = Math.pow(Math.min(1, edge * fall), 0.85);
        const q = i * 4;
        out[q] = cr; out[q + 1] = cg; out[q + 2] = cb;
        out[q + 3] = Math.pow(k, 1.6) * falloff * 255;
      }
    }
    const ocv = document.createElement('canvas');
    ocv.width = iw; ocv.height = ih;
    const og = ocv.getContext('2d');
    og.putImageData(new ImageData(out, iw, ih), 0, 0);
    og.globalCompositeOperation = 'destination-in';
    og.drawImage(maskCanvas, 0, 0, iw, ih);
    return ocv.toDataURL('image/png');
  }

  /* ── live inner-shadow updates ──────────────────────────────────────────
     The per-pixel normal pass is fast, but encoding a 1.5 k-px PNG is not —
     so the identical painter runs in the existing worker and only the finished
     image comes back. Slider drags therefore never touch the main thread. */
  let innerJob = 0;
  let swapGuard = 0;

  function paintInnerNow(alpha, w, h, ss) {
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      img.data[i * 4] = 255; img.data[i * 4 + 1] = 255; img.data[i * 4 + 2] = 255;
      img.data[i * 4 + 3] = alpha[i];
    }
    ctx.putImageData(img, 0, 0);
    const cfg = CONFIG.glass.inner;
    const mk = maskCache.key;
    const url = paintInnerCpu(cv, w, h, ss, cfg);
    const key = [w, h, ss, mk, cfg.thickness, cfg.angle, cfg.color].join('|');
    innerCache = { key, url };
    setInnerImage(url, key);
  }

  let innerShownKey = '';
  let innerWaiters = [];

  function setInnerImage(url, key) {
    innerEl.style.backgroundImage = url ? `url("${url}")` : 'none';
    innerShownKey = key || '';
    if (!key) return;
    const ready = innerWaiters.filter((w) => w.key === key);
    innerWaiters = innerWaiters.filter((w) => w.key !== key);
    ready.forEach((w) => w.once());
  }

  /* Fade the clock back in only when the matching shadow map is in place, so a
     font/colour switch can never show a rim that belongs to the old glyphs. */
  function whenInnerReady(key, cb) {
    if (innerShownKey === key) { cb(); return; }
    const w = { key, once: () => { if (w.done) return; w.done = true; cb(); } };
    innerWaiters.push(w);
    setTimeout(w.once, 520);        // hard cap: the clock must never stay blank
  }

  function onInnerResult(d) {
    if (d.jobId !== innerJob) return;                 // a newer slider position won
    const previous = innerCache.url;
    const url = URL.createObjectURL(d.blob);
    innerCache = { key: d.key, url };
    setInnerImage(url, d.key);
    if (previous && previous.startsWith('blob:') && previous !== url) URL.revokeObjectURL(previous);
  }

  /* Called live by the sliders: no refraction rebuild, no bitmap rebuild. */
  function refreshInner() {
    if (!lastMaskCanvas || !lastMaskAlpha) { schedule(true); return; }
    const cfg = CONFIG.glass.inner;
    const w = lastMaskCanvas.width, h = lastMaskCanvas.height;
    innerEl.style.opacity = String(Math.max(0, Math.min(1, cfg.intensity)));
    if (!(cfg.thickness > 0) || !(cfg.intensity > 0)) { setInnerImage(''); return; }
    const key = [w, h, lastSS, maskCache.key, cfg.thickness, cfg.angle, cfg.color].join('|');
    if (key === innerShownKey) return;                     // already on screen
    postInner(key, w, h);
  }

  /* Paint (or repaint) the map for a specific key — used by the fade path so a
     new font can never fade in wearing the previous glyphs' rim. */
  function refreshInnerFor(key, alpha, w, h, ss) {
    if (!alpha || !key) return;
    if (key === innerShownKey) return;
    if (innerCache.key === key && innerCache.url) { setInnerImage(innerCache.url, key); return; }
    if (ensureInnerWorker()) postInnerFor(key, alpha, w, h, ss);
    else paintInnerNow(alpha, w, h, ss);          // no Worker at all: do it now
  }

  let innerPosted = '';
  function resetInnerPost() { innerPosted = ''; }
  function postInnerFor(key, alpha, w, h, ss) {
    if (!alpha || !key) return;
    if (key === innerPosted) return;
    /* during a resize the refraction job is the one that matters — the rim is
       repainted once, when the gesture ends */
    if (document.body.classList.contains('resizing')) return;
    const wk = ensureInnerWorker();
    if (!wk) return;                                // paintInnerNow handles the fallback
    innerPosted = key;
    const cfg = CONFIG.glass.inner;
    const alphaBuf = alpha.slice().buffer;
    wk.postMessage({
      kind: 'inner', jobId: ++innerJob, key, w, h,
      alphaBuf,
      cfg: { thickness: cfg.thickness, angle: cfg.angle, color: cfg.color, ss }
    }, [alphaBuf]);
  }

  function postInner(key, w, h) {
    /* during a resize the refraction job is the one that matters — the rim is
       repainted once, when the gesture ends */
    if (document.body.classList.contains('resizing')) return;
    const cfg = CONFIG.glass.inner;
    const wk = ensureInnerWorker();
    if (!wk) { paintInnerNow(lastMaskAlpha, w, h, lastSS); return; }
    if (key === innerPosted) return;                    // already on its way
    innerPosted = key;
    const jobId = ++innerJob;
    const alphaBuf = lastMaskAlpha.slice().buffer;
    wk.postMessage({
      kind: 'inner', jobId, key, w, h,
      alphaBuf,
      cfg: { thickness: cfg.thickness, angle: cfg.angle, color: cfg.color, ss: lastSS }
    }, [alphaBuf]);
  }

  function renderBitmap(lines) {
    const c = CONFIG.clock;
    const host = $('screen');
    const hostW = host.clientWidth || 390;

    let size = c.size;
    // fit inside the viewport with side breathing room
    const maxW = hostW * 0.88;
    const dpr = window.devicePixelRatio || 1;
    let ss = Math.min(3, Math.max(2, Math.round(dpr * 1.5)));

    const probe = document.createElement('canvas').getContext('2d');
    probe.font = `${state.font === 'SF' ? 600 : c.weight} ${size}px ${fontStack()}`;
    if ('letterSpacing' in probe) probe.letterSpacing = `${c.tracking}px`;

    let maxLineW = 0;
    for (const ln of lines) maxLineW = Math.max(maxLineW, probe.measureText(ln).width);

    const rawW = Math.max(40, maxLineW * c.sx);
    // One uniform fit preserves the user's glyph proportions on every screen.
    // Reserve the music/shortcut area; never write this automatic fit to storage.
    const layer = $('clock-layer').getBoundingClientRect();
    const card = $('np');
    const bottom = $('bottom');
    const obstacle = state.npOn ? card : bottom;
    const obstacleTop = obstacle.getBoundingClientRect().top;
    const availableH = Math.max(72, Math.min(host.clientHeight * .43,
      obstacleTop - layer.top - 24));
    const rawH = Math.max(40, lines.length * size * .92 * c.sy);
    const fit = Math.min(1, (maxW - 36) / rawW, (availableH - 36) / rawH);
    size *= Math.max(.1, fit);

    probe.font = `${state.font === 'SF' ? 600 : c.weight} ${size}px ${fontStack()}`;
    if ('letterSpacing' in probe) probe.letterSpacing = `${c.tracking}px`;
    maxLineW = 0;
    for (const ln of lines) maxLineW = Math.max(maxLineW, probe.measureText(ln).width);

    const lineH = size * 0.92;
    const pad = 18;
    const wCss = Math.ceil(Math.max(40, maxLineW * c.sx) + pad * 2);
    const hCss = Math.ceil(Math.max(40, lines.length * lineH * c.sy) + pad * 2);

    const longSide = Math.max(wCss, hCss);
    if (longSide * ss > 1600) ss = Math.max(1, Math.floor((1600 / longSide) * 10) / 10);

    const w = Math.max(4, Math.round(wCss * ss));
    const h = Math.max(4, Math.round(hCss * ss));

    const maskKey = [size.toFixed(2), w, h, state.font, c.sx, c.sy, c.tracking, lines.join('|')].join('|');
    if (maskCache.key === maskKey) {
      const innerKey = [w,h,ss,maskKey,CONFIG.glass.inner.thickness,CONFIG.glass.inner.angle,CONFIG.glass.inner.color].join('|');
      return Object.assign({}, maskCache.meta, { innerKey, innerUrl: innerCache.key === innerKey ? innerCache.url : '' });
    }


    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.scale(ss * c.sx, ss * c.sy);
    ctx.font = `${state.font === 'SF' ? 600 : c.weight} ${size}px ${fontStack()}`;
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${c.tracking}px`;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const cx = (wCss / 2) / c.sx;
    lines.forEach((ln, i) => ctx.fillText(ln, cx, ((hCss / 2) / c.sy)));

    const img = ctx.getImageData(0, 0, w, h);
    const alpha = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) {
      alpha[i] = img.data[i * 4 + 3];
      img.data[i * 4] = 255; img.data[i * 4 + 1] = 255; img.data[i * 4 + 2] = 255;
    }
    ctx.putImageData(img, 0, 0);

    /* The inner map is a per-pixel pass + a PNG encode. It must never run
       inside a click handler, so it is produced asynchronously (worker) and
       the clock only fades back in once it is ready. */
    const innerKey = [w, h, ss, maskKey, CONFIG.glass.inner.thickness,
                      CONFIG.glass.inner.angle, CONFIG.glass.inner.color].join('|');
    const innerUrl = innerCache.key === innerKey ? innerCache.url : '';

    const built = {
      alpha, w, h, ss, wCss, hCss,
      alphaKey: maskKey,
      innerUrl, innerKey,
      maskCanvas: cv,
      maskUrl: cv.toDataURL('image/png'),
      size, lines,
      textW: Math.max(40, maxLineW * c.sx),
      textH: Math.max(40, lines.length * lineH * c.sy),
      lineH,
      pad: pad * 2
    };
    maskCache = { key: maskKey, meta: built };
    return built;
  }

  function bufToUrl(buf, w, h) {
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.putImageData(new ImageData(new Uint8ClampedArray(buf), w, h), 0, 0);
    return cv.toDataURL('image/png');
  }

  let glassObjects = [];
  function onWorkerResult(e) {
    if (e.data.kind === 'inner') { onInnerResult(e.data); return; }
    const { jobId, w, h, maxAbsCss, dispBuf, shadBuf, dispBlob, shadBlob } = e.data;
    const meta = pendingMeta.get(jobId);
    pendingMeta.delete(jobId);
    if (!meta || jobId !== jobSeq) return;
    const previousObjects = glassObjects;
    glassObjects = dispBlob ? [URL.createObjectURL(dispBlob), URL.createObjectURL(shadBlob)] : [];
    const disp = glassObjects[0] || bufToUrl(dispBuf, w, h);
    const shad = glassObjects[1] || bufToUrl(shadBuf, w, h);
    // Give a pending cross-fade time to release the old filter textures.
    setTimeout(() => previousObjects.forEach(url => URL.revokeObjectURL(url)), 2000);
    glassCache = {
      key: [meta.w, meta.h, meta.ss, meta.alphaKey,
            CONFIG.glass.surface, CONFIG.glass.ior,
            CONFIG.glass.thickness, CONFIG.glass.bezel].join('|'),
      disp, shad, maxAbs: maxAbsCss
    };
    apply(meta, disp, shad, maxAbsCss);
  }

  let lastMetrics = null;
  let lastMaskCanvas = null;
  let lastMaskAlpha = null;
  let lastSS = 2;

  function apply(meta, dispUrl, shadUrl, maxAbsCss) {
    lastMetrics = {
      textW: meta.textW, textH: meta.textH, pad: meta.pad,
      baseW: meta.textW / Math.max(0.05, CONFIG.clock.sx),
      baseH: meta.textH / Math.max(0.05, CONFIG.clock.sy)
    };
    /* Assigning an unchanged width/height still re-rasterises the clock's
       backdrop-filter, so only touch the geometry when it really moved. */
    const setBox = (el, w, h) => {
      if (el.style.width !== w + 'px') el.style.width = w + 'px';
      if (el.style.height !== h + 'px') el.style.height = h + 'px';
    };
    /* mask strings are long data URLs — only write them when they differ */
    const setMask = (el, url) => {
      if (el.style.maskImage === url) return;
      el.style.maskImage = url;
      el.style.webkitMaskImage = url;
    };
    const paint = () => {
      const mask = `url(${meta.maskUrl})`;
      const sameMask = glassEl.style.maskImage === mask;
      setBox(glassEl, meta.wCss, meta.hCss);
      setMask(glassEl, mask);
      setBox(shadowEl, meta.wCss, meta.hCss);
      /* ink follows the adaptive colour (dark on light walls, white on dark),
         so the white halo always reads as a shadow behind the digits */
      shadowEl.style.background = state.color === 'auto' ? '' : state.color;
      setMask(shadowEl, mask);
      /* INNER shadow — same paintShadow maths as the cards, but rendered on a
         2× canvas so the edge stays crisp (no banding/pixelation), tinted with
         the colour the user picked and rotated by the chosen angle. */
      const si = Math.max(0, Math.min(1, CONFIG.glass.inner.intensity));
      setBox(innerEl, meta.wCss, meta.hCss);
      innerEl.style.left = '0px';   /* #clock-glow is already aligned with the glass */
      innerEl.style.top = '0px';
      /* The inner rim belongs to a specific glyph raster: only swap it when the
         key changes, and never leave the previous glyphs' rim on screen. */
      if (innerShownKey !== meta.innerKey) {
        if (innerCache.key === meta.innerKey && innerCache.url) {
          setInnerImage(innerCache.url, meta.innerKey);
        } else {
          setInnerImage('');
          refreshInnerFor(meta.innerKey, meta.alpha, meta.w, meta.h, meta.ss);
        }
      }
      setMask(innerEl, mask);
      innerEl.style.opacity = String(si);
      setBox(glowEl, meta.wCss, meta.hCss);
      glowEl.style.left = glassEl.offsetLeft + 'px';
      glowEl.style.top = glassEl.offsetTop + 'px';
      glowEl.style.filter = 'none';
      glassEl.style.background = '';   // --clock-tint (set by Adaptive) drives it
      glassEl.style.mixBlendMode = 'normal';

      if (canGlass) {
        fbEl.style.display = 'none';
        const uid = 'clockFilter';
        const key = [meta.alphaKey, dispUrl, meta.wCss, meta.hCss, maxAbsCss].join('|');
        const bf = `url(#${uid}) blur(1.5px) saturate(1.2) brightness(0.96)`;
        let f = document.getElementById(uid);
        /* A new <filter> node forces the whole clock to re-rasterise. When the
           displacement map has not changed we keep the node and touch nothing —
           that is what makes a font/colour change cost no paint at all. */
        if (!f || f.dataset.key !== key) {
          if (f) f.remove();
          f = document.createElementNS(NS, 'filter');
          f.setAttribute('id', uid);
          f.setAttribute('color-interpolation-filters', 'sRGB');
          f.dataset.key = key;
          const pad = Math.ceil(maxAbsCss * 2) + 6;
          f.setAttribute('filterUnits', 'userSpaceOnUse');
          f.setAttribute('x', -pad); f.setAttribute('y', -pad);
          f.setAttribute('width', meta.wCss + pad * 2);
          f.setAttribute('height', meta.hCss + pad * 2);
          const im = document.createElementNS(NS, 'feImage');
          im.setAttribute('href', dispUrl);
          im.setAttributeNS(XLINK, 'xlink:href', dispUrl);
          im.setAttribute('x', 0); im.setAttribute('y', 0);
          im.setAttribute('width', meta.wCss); im.setAttribute('height', meta.hCss);
          im.setAttribute('preserveAspectRatio', 'none');
          im.setAttribute('result', 'dispMap');
          f.appendChild(im);
          const dm = document.createElementNS(NS, 'feDisplacementMap');
          dm.setAttribute('in', 'SourceGraphic');
          dm.setAttribute('in2', 'dispMap');
          dm.setAttribute('scale', maxAbsCss * 2);
          dm.setAttribute('xChannelSelector', 'R');
          dm.setAttribute('yChannelSelector', 'G');
          f.appendChild(dm);
          defsRoot().appendChild(f);
          if (glassEl.style.backdropFilter !== bf) {
            glassEl.style.backdropFilter = bf;
            glassEl.style.webkitBackdropFilter = bf;
          }
        }
      } else {
        glassEl.style.backdropFilter = 'blur(16px) saturate(1.4) brightness(1.06)';
        glassEl.style.webkitBackdropFilter = glassEl.style.backdropFilter;
        fbEl.style.display = 'flex';
        fbEl.textContent = meta.lines.join('\n');
        fbEl.style.fontFamily = fontStack();
        fbEl.style.fontWeight = state.font === 'SF' ? '600' : String(CONFIG.clock.weight);
        fbEl.style.fontSize = meta.size + 'px';
        fbEl.style.transform = `scale(${CONFIG.clock.sx}, ${CONFIG.clock.sy})`;
        fbEl.style.letterSpacing = CONFIG.clock.tracking + 'px';
      }
      applyPosition();
      glowEl.dataset.painted = String(meta.minuteKey || '');
    };

    if (meta.isTick) {
      // cross-fade: minute ticks, format changes, font/colour/size edits…
      // (a live resize sets meta.hardCut so the handles stay glued to the digits)
      const dur = meta.hardCut ? 1 : 170;
      /* the clock is about to be invisible for a moment: while it is, the
         expensive refraction filter is switched off so the browser does not
         have to re-rasterise it twice for one change */
      clearTimeout(swapGuard);
      if (!meta.hardCut) {
        document.body.classList.add('swapping');
        // safety: the glass must never stay on the cheap tint
        swapGuard = setTimeout(() => document.body.classList.remove('swapping'), 1400);
      }
      glassEl.style.transition = `opacity ${dur}ms ease`;
      glowEl.style.transition = `opacity ${dur}ms ease`;
      innerEl.style.transition = `opacity ${dur}ms ease`;
      glassEl.style.opacity = '0';
      glowEl.style.opacity = '0';
      innerEl.style.opacity = '0';
      const expect = meta.minuteKey;
      const innerKeyNeeded = meta.innerKey;
      setTimeout(() => {
        /* Paint while the clock is INVISIBLE, then let the browser finish the
           expensive backdrop-filter raster before anything fades back in — so
           the re-raster jank lands on a blank frame instead of on the animation. */
        paint();
        const fadeInNow = () => {
          // filter back on first, so the fade-in already shows the real glass
          clearTimeout(swapGuard);
          document.body.classList.remove('swapping');
          glassEl.style.opacity = '1';
          glowEl.style.opacity = '1';
          innerEl.style.opacity = String(Math.max(0, Math.min(1, CONFIG.glass.inner.intensity)));
          setTimeout(() => {
            glassEl.style.transition = '';
            glowEl.style.transition = '';
            innerEl.style.transition = '';
          }, dur + 60);
        };
        const fadeIn = () => {
          if (innerKeyNeeded && innerShownKey !== innerKeyNeeded &&
              CONFIG.glass.inner.thickness > 0 && CONFIG.glass.inner.intensity > 0) {
            whenInnerReady(innerKeyNeeded, fadeInNow);   // capped, never stalls
          } else fadeInNow();
        };
        /* two frames: the first commits the new geometry, the second rasterises
           it while the clock is still invisible */
        requestAnimationFrame(() => requestAnimationFrame(fadeIn));
        // safety net: if a fresher frame never arrived, make sure we are opaque
        setTimeout(() => {
          if (glowEl.dataset.painted !== expect) return;
          glassEl.style.opacity = '1';
          glowEl.style.opacity = '1';
        }, 420);
      }, meta.hardCut ? 0 : 110);
    } else {
      requestAnimationFrame(paint);
    }
  }

  function build(force) {
    const t = getTime();
    const key = [t.lines.join('|'), state.font, CONFIG.clock.size, CONFIG.clock.sx, CONFIG.clock.sy, CONFIG.clock.tracking, state.color, $('screen').clientWidth, $('screen').clientHeight].join('#');
    if (!force && key === lastKey) return;
    /* Anything that changes the drawing cross-fades: the clock never blinks
       into a new shape. Only a live resize goes straight through, so the
       handles can stay glued to the digits while dragging. */
    const isTick = lastMinute !== '' && (lastMinute !== t.minuteKey || lastKey !== key);
    const hardCut = document.body.classList.contains('resizing');
    lastKey = key;
    lastMinute = t.minuteKey;

    const meta = renderBitmap(t.lines);
    lastMaskCanvas = meta.maskCanvas; lastMaskAlpha = meta.alpha; lastSS = meta.ss;
    meta.isTick = isTick && !hardCut;
    meta.hardCut = hardCut;
    const jobId = ++jobSeq;
    pendingMeta.clear(); // obsolete jobs must not retain multi-megapixel masks
    pendingMeta.set(jobId, meta);

    const params = {
      surface: CONFIG.glass.surface,
      ior: CONFIG.glass.ior,
      thickness: CONFIG.glass.thickness,
      bezel: CONFIG.glass.bezel,
      shadowThickness: CONFIG.glass.inner.thickness,
      shadowAngle: CONFIG.glass.inner.angle
    };

    /* ── glass raster cache ─────────────────────────────────────────── */
    const gk = [meta.w, meta.h, meta.ss, meta.alphaKey,
                params.surface, params.ior, params.thickness, params.bezel].join('|');
    if (glassCache.key === gk && glassCache.disp) {
      // reuse: no worker round-trip, no SDF, no EDT, no PNG encode
      pendingMeta.delete(jobId);
      apply(meta, glassCache.disp, glassCache.shad, glassCache.maxAbs);
      return;
    }

    /* start the rim for these new glyphs immediately: it is what the
       cross-fade waits for, and the worker needs a head start */
    if (CONFIG.glass.inner.thickness > 0 && innerCache.key !== meta.innerKey) {
      postInnerFor(meta.innerKey, meta.alpha, meta.w, meta.h, meta.ss);
    }

    const wk = ensureWorker();
    if (wk) {
      // send a copy: the main thread keeps the alpha for live inner-shadow repaints
      const ab = meta.alpha.slice().buffer;
      wk.postMessage({ jobId, alphaBuf: ab, w: meta.w, h: meta.h, ss: meta.ss, params }, [ab]);
    } else {
      runOnMain(jobId, meta, params);
    }
  }

  /* No Worker: run the identical generator in idle chunks. */
  function getMainCore() {
    if (mainCore) return mainCore;
    const src = WORKER_SRC.slice(0, WORKER_SRC.indexOf('self.onmessage'));
    mainCore = new Function(src + '\nreturn computeGlassJob;')();
    return mainCore;
  }
  function runOnMain(jobId, meta, params) {
    const it = getMainCore()(meta.alpha, meta.w, meta.h, meta.ss, params);
    const pump = (dl) => {
      if (jobId !== jobSeq) return;
      let r;
      do {
        r = it.next();
        if (r.done) {
          const res = r.value;
          apply(meta, bufToUrl(res.dispBuf, meta.w, meta.h), bufToUrl(res.shadBuf, meta.w, meta.h), res.maxAbsCss);
          return;
        }
      } while (dl && dl.timeRemaining() > 4);
      if (window.requestIdleCallback) requestIdleCallback(pump, { timeout: 90 });
      else setTimeout(() => pump(null), 6);
    };
    if (window.requestIdleCallback) requestIdleCallback(pump, { timeout: 90 });
    else setTimeout(() => pump(null), 0);
  }

  /* Coalesce bursts: dragging a slider fires dozens of events, we render one
     frame after the user actually pauses for a moment. */
  let buildTimer = 0;
  function schedule(force, delay) {
    cancelAnimationFrame(rafPending);
    clearTimeout(buildTimer);
    if (delay) {
      buildTimer = setTimeout(() => { rafPending = requestAnimationFrame(() => build(force)); }, delay);
      return;
    }
    rafPending = requestAnimationFrame(() => build(force));
  }

  let preview = { x: 1, y: 1 };

  function applyPosition() {
    const sc = preview.x === 1 && preview.y === 1 ? '' : ` scale(${preview.x}, ${preview.y})`;
    wrap.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0)${sc}`;
    if (frame.classList.contains('on') && !frameDirty) {
      frameDirty = true;
      requestAnimationFrame(syncFrameBox);
    }
    // keep the Now Playing card clear of a dragged clock
    const r = wrap.getBoundingClientRect();
    document.documentElement.style.setProperty('--clock-h', Math.round(r.height) + 'px');
  }

  /* The clock is PINNED: dragging never moves it. A long press is the only
     gesture, and it just opens the resize handles. */
  let holdTimer = 0;
  let holdFrom = null;
  let holdFired = false;

  /* Long-press = resize. It must survive tiny finger wobble (phones always
     report a few px), so the hold is only cancelled after a real movement. */
  wrap.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();
    holdFired = false;
    holdFrom = { x: e.clientX, y: e.clientY };
    try { wrap.setPointerCapture(e.pointerId); } catch (_) {}
    rememberLastSize();                 // snapshot for the ↺ undo button
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      holdFired = true;
      openResize();
    }, 360);
  });
  const endHold = () => { clearTimeout(holdTimer); holdTimer = 0; holdFrom = null; };
  wrap.addEventListener('pointerup', endHold);
  wrap.addEventListener('pointercancel', endHold);
  wrap.addEventListener('pointerleave', endHold);
  wrap.addEventListener('lostpointercapture', endHold);
  wrap.addEventListener('pointermove', (e) => {
    if (!holdFrom) return;
    // real drag, not wobble → this is not a long press
    if (Math.hypot(e.clientX - holdFrom.x, e.clientY - holdFrom.y) > 14) endHold();
  });
  /* a plain tap (no hold) does nothing, but must not leave a timer behind */
  wrap.addEventListener('click', () => { if (!holdFired) clearTimeout(holdTimer); });

  /* ── Long-press resize: drag any handle to stretch/shrink the digits.
     Only the pixel size changes — the chosen font, weight and stretch stay. ── */
  const frame = $('clock-frame');
  const sizeKey = 'clockSize';
  let rs = null;

  function layoutFrame() {
    // use the element's own box so a CSS preview scale doesn't inflate the frame,
    // and measure the GLASS (not the padded wrapper) so the handles sit on the digits
    const host = $('screen').getBoundingClientRect();
    const g = glassEl.getBoundingClientRect();
    const r = g.width > 8 ? g : wrap.getBoundingClientRect();
    frame.style.left = (r.left - host.left) + 'px';
    frame.style.top = (r.top - host.top) + 'px';
    frame.style.width = r.width + 'px';
    frame.style.height = r.height + 'px';
  }

  function openResize() {
    boxCache = null;            // re-measure the safe area once
    clampInsideScreen();
    layoutFrame();
    frame.classList.add('on');
    frame.setAttribute('aria-hidden', 'false');
    document.body.classList.add('resizing');
    vib(18);
    if (navigator.vibrate) { try { navigator.vibrate([0, 14, 40, 14]); } catch (_) {} }
    clearTimeout(openResize._t);
    // auto-dismiss after a while so it never lingers
    openResize._t = setTimeout(closeResize, 9000);
  }
  function closeResize() {
    frame.classList.remove('on');
    frame.setAttribute('aria-hidden', 'true');
    if (!rs) document.body.classList.remove('resizing');
    clearTimeout(openResize._t);
    if (rs) {
      rs = null;
      preview = { x: 1, y: 1 };
      applyPosition();
      Clock.schedule(true);
    }
  }

  frame.querySelectorAll('[data-h]').forEach((h) => {
    h.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      e.preventDefault();
      clearTimeout(openResize._t);
      const dir = h.dataset.h;
      rs = {
        dir,
        x0: e.clientX, y0: e.clientY,
        size: CONFIG.clock.size,
        sx: CONFIG.clock.sx,
        sy: CONFIG.clock.sy,
        w: clockMetrics().textW,
        h: clockMetrics().textH,
        pendX: 0, pendY: 0,
        raf: 0
      };
      h.setPointerCapture(e.pointerId);
    });

    h.addEventListener('pointermove', (e) => {
      if (!rs) return;
      // accumulate deltas from the start point so the result is stable, not drifting
      rs.pendX = e.clientX - rs.x0;
      rs.pendY = e.clientY - rs.y0;
      if (!rs.raf) rs.raf = requestAnimationFrame(applyHandleDelta);
    });

    const done = () => {
      if (!rs) return;
      cancelAnimationFrame(rs.raf);
      rs = null;
      preview = { x: 1, y: 1 };
      applyPosition();
      persistGeometry();
      // hand the expensive filter back only after the new raster is ready,
      // so the release never flashes a flat tint
      Clock.schedule(true);
      setTimeout(() => document.body.classList.remove('resizing'), 90);
      vib(8);
    };
    h.addEventListener('pointerup', done);
    h.addEventListener('pointercancel', done);
  });

  /* Geometry of the digits themselves (not the padded canvas), used as the
     starting box and to compute the safety limits. */
  function clockMetrics() {
    if (!lastMetrics) {
      const r = wrap.getBoundingClientRect();
      return { textW: r.width || 200, textH: r.height || 200 };
    }
    return lastMetrics;
  }

  /* One rAF per frame. Each axis is independent; whatever the pointer does,
     the result is clamped so the digits can never leave the screen, reach the
     status bar / island, or overlap the music card. */
  function applyHandleDelta() {
    if (!rs) return;
    rs.raf = 0;
    const { dir, pendX: dx, pendY: dy } = rs;
    const horiz = /e|w/.test(dir);
    const vert = /n|s/.test(dir);
    const lim = limits();

    if (horiz) {
      const nextW = clamp(rs.w + dx * (dir.includes('w') ? -1 : 1), lim.minW, lim.maxW);
      CONFIG.clock.sx = clamp(rs.sx * (nextW / rs.w), lim.minSx, lim.maxSx);
    }
    if (vert) {
      const nextH = clamp(rs.h + dy * (dir.includes('n') ? -1 : 1), lim.minH, lim.maxH);
      CONFIG.clock.sy = clamp(rs.sy * (nextH / rs.h), lim.minSy, lim.maxSy);
    }
    renderPreview();
  }

  function renderPreview() {
    if (!rs) return;
    preview = {
      x: CONFIG.clock.sx / rs.sx,
      y: CONFIG.clock.sy / rs.sy
    };
    // one composited write, no layout reads in the hot path
    wrap.style.transform =
      `translate3d(${pos.x}px, ${pos.y}px, 0) scale(${preview.x}, ${preview.y})`;
    if (frameDirty) return;
    frameDirty = true;
    requestAnimationFrame(syncFrameBox);
  }

  let frameDirty = false;
  function syncFrameBox() {
    frameDirty = false;
    if (!frame.classList.contains('on')) return;
    layoutFrame();
  }

  /* Safe box, recomputed every time the frame opens. */
  let boxCache = null;

  /* Measured once when the frame opens (or on rotate) — never in the drag loop. */
  function measureBox() {
    const host = $('screen').getBoundingClientRect();
    const m = clockMetrics();
    const pad = (m.pad || 32) + 8;
    const topSafe = Math.max(
      $('topline').getBoundingClientRect().bottom + 10,
      $('clock-layer').getBoundingClientRect().top + 2
    );
    const cardTop = $('np').getBoundingClientRect().top - 16;
    boxCache = {
      vw: host.width, vh: host.height,
      pad, topSafe, cardTop: Math.max(topSafe + 80, cardTop)
    };
  }

  function limits() {
    if (!boxCache) measureBox();
    const m = clockMetrics();
    const pad = boxCache.pad;
    const maxW = Math.max(140, boxCache.vw - 36 - pad);
    const maxH = Math.max(96, Math.min(boxCache.cardTop - boxCache.topSafe, boxCache.vh * 0.6) - pad);
    return {
      maxW, maxH,
      minW: Math.min(maxW, 110),
      minH: Math.min(maxH, 70),
      maxSx: clamp(maxW / Math.max(1, m.baseW), 0.3, 2.8),
      maxSy: clamp(maxH / Math.max(1, m.baseH), 0.4, 3.2),
      minSx: clamp(110 / Math.max(1, m.baseW), 0.3, 1.2),
      minSy: clamp(70 / Math.max(1, m.baseH), 0.4, 1.4)
    };
  }

  /* If a saved size is too big for this screen, bring it back in bounds. */
  function clampInsideScreen() {
    boxCache = null;
    // Fit at raster time with one scale; rotation must not stretch or save sx/sy.
    Clock.schedule(true);
  }

  function persistGeometry() {
    state.clockSize = CONFIG.clock.size;
    state.clockSx = CONFIG.clock.sx;
    state.clockSy = CONFIG.clock.sy;
    save();
  }

  function clampSize(v) { return Math.max(56, Math.min(260, v)); }

  /* Undo: keeps the size from before the frame was opened. */
  let lastSize = null;
  function rememberLastSize() {
    lastSize = { size: CONFIG.clock.size, sx: CONFIG.clock.sx, sy: CONFIG.clock.sy };
  }
  function undoSize() {
    if (!lastSize) return;
    CONFIG.clock.size = lastSize.size;
    CONFIG.clock.sx = lastSize.sx;
    CONFIG.clock.sy = lastSize.sy;
    persistGeometry();
    Clock.schedule(true);
    layoutFrame();
    vib(10);
  }
  $('clock-frame-undo').addEventListener('click', (e) => {
    e.stopPropagation();
    undoSize();
  });
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  $('clock-frame-reset').addEventListener('click', (e) => {
    e.stopPropagation();
    CONFIG.clock.size = 128;
    CONFIG.clock.sx = 0.94;
    CONFIG.clock.sy = 1.62;
    persistGeometry();
    Clock.schedule(true);
    layoutFrame();
    vib(10);
  });

  /* Anywhere else closes the frame. */
  document.addEventListener('pointerdown', (e) => {
    if (!frame.classList.contains('on')) return;
    if (e.target.closest('#clock-frame')) return;
    closeResize();
  });

  function hexA(hex, a) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '#ffffff');
    if (!m) return `rgba(255,255,255,${a})`;
    return `rgba(${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)},${a})`;
  }

  return {
    schedule, applyPosition, refreshInner,
    getPos: () => pos,
    setPos: (p) => { pos = p; applyPosition(); },
    openResize, closeResize,
    guard: clampInsideScreen,
    metrics: () => clockMetrics(),
    limits: () => limits(),
    relayout: () => { if (frame.classList.contains('on')) layoutFrame(); }
  };
})();

/* Small spring helper used by a few UI bits. */
const springs = new Map();
let springRaf = 0, springLast = 0;
function springTo(key, from, to, k = 0.3, cb) {
  springs.set(key, { v: from, t: to, vel: 0, k, cb });
  if (!springRaf) { springLast = 0; springRaf = requestAnimationFrame(springStep); }
}
function springStep(now) {
  if (!springLast) springLast = now;
  const dt = Math.min(0.032, Math.max(0.001, (now - springLast) / 1000));
  springLast = now;
  for (const [key, s] of springs) {
    const force = -(s.k * 220) * (s.v - s.t) - (2 * Math.sqrt(s.k * 220) * 0.82) * s.vel;
    s.vel += force * dt;
    s.v += s.vel * dt;
    if (Math.abs(s.v - s.t) < 0.05 && Math.abs(s.vel) < 0.6) {
      s.v = s.t; s.cb(s.v); springs.delete(key); continue;
    }
    s.cb(s.v);
  }
  springRaf = springs.size ? requestAnimationFrame(springStep) : 0;
}

/* ============================================================================
   3. WALLPAPERS (drawn once, cached as data URL)
   ========================================================================= */
const Wallpapers = (() => {
  function draw(name) {
    const c = document.createElement('canvas');
    c.width = 900; c.height = 1800;
    const x = c.getContext('2d');
    const W = c.width, H = c.height;

    const sky = (stops) => {
      const g = x.createLinearGradient(0, 0, W * 0.35, H);
      stops.forEach(([p, col]) => g.addColorStop(p, col));
      x.fillStyle = g; x.fillRect(0, 0, W, H);
    };
    const blob = (cx, cy, r, col) => {
      const g = x.createRadialGradient(cx, cy, r * 0.05, cx, cy, r);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
    };

    if (name === 'angel') {
      sky([[0,'#a9c1dd'],[0.34,'#dfcbd7'],[0.64,'#9db0c9'],[0.86,'#5a6a81'],[1,'#333e51']]);
      blob(220, 400, 420, 'rgba(255,255,255,.55)');
      blob(660, 300, 380, 'rgba(255,255,255,.42)');
      blob(450, 980, 520, 'rgba(255,255,255,.22)');
      for (let i = 0; i < 5; i++) {
        const y0 = 760 + i * 110;
        const g = x.createLinearGradient(0, y0 - 70, 0, y0 + 70);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.5, `rgba(255,255,255,${0.26 - i * 0.04})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = g;
        x.beginPath(); x.moveTo(0, y0);
        for (let px = 0; px <= W; px += 40) x.lineTo(px, y0 + Math.sin((px / W) * 5 + i) * 28);
        x.lineTo(W, y0 + 150); x.lineTo(0, y0 + 150); x.closePath(); x.fill();
      }
      const sh = x.createRadialGradient(W*0.5, 760, 40, W*0.5, 1100, 620);
      sh.addColorStop(0,'rgba(255,250,242,.34)'); sh.addColorStop(1,'rgba(255,250,242,0)');
      x.fillStyle = sh; x.fillRect(0, 400, W, H - 400);
      const vg = x.createRadialGradient(W/2,H*0.42,H*0.2,W/2,H*0.5,H*0.8);
      vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(20,26,38,.34)');
      x.fillStyle = vg; x.fillRect(0,0,W,H);
    } else if (name === 'obsidian') {
      sky([[0,'#171b24'],[0.5,'#0a0c11'],[1,'#000']]);
      blob(W*0.5, H*0.34, W*0.9, 'rgba(90,110,150,.20)');
    } else if (name === 'dusk') {
      sky([[0,'#2a1c46'],[0.3,'#7c3f6b'],[0.58,'#d9705c'],[0.78,'#f2b07a'],[1,'#2b2039']]);
      blob(W*0.7, H*0.66, 300, 'rgba(255,215,160,.65)');
      blob(W*0.2, H*0.2, 420, 'rgba(120,90,200,.35)');
    } else if (name === 'aurora') {
      sky([[0,'#0b1030'],[0.42,'#1c4d8c'],[0.72,'#2aa88a'],[1,'#101a34']]);
      blob(240, 620, 420, 'rgba(90,255,190,.45)');
      blob(700, 900, 460, 'rgba(120,90,255,.45)');
      blob(430, 380, 360, 'rgba(70,200,255,.35)');
    } else if (name === 'daylight') {
      sky([[0,'#f2f6fb'],[0.46,'#e2ebf4'],[1,'#bfd0e2']]);
      blob(W*0.7, 380, 420, 'rgba(255,255,255,.85)');
    } else {
      sky([[0,'#242a36'],[1,'#0c1016']]);
      blob(W*0.5, H*0.3, W*0.8, 'rgba(120,140,180,.22)');
    }
    return c.toDataURL('image/jpeg', 0.86);
  }

  const cache = new Map();
  const PRESETS = ['angel', 'obsidian', 'dusk', 'aurora', 'daylight'];

  const thumbs = new Map();
  function urlFor(name) {
    if (state.wall === 'custom' && state.customWall) return state.customWall;
    if (!cache.has(name)) cache.set(name, draw(name));
    return cache.get(name);
  }
  /* small version for the picker: same art, a fifth of the pixels */
  function thumb(name) {
    if (state.wall === 'custom' && state.customWall && name === state.wall) return state.customWall;
    if (!thumbs.has(name)) {
      const full = urlFor(name);
      thumbs.set(name, full);
    }
    return thumbs.get(name);
  }

  function apply() {
    const el = $('wall');
    const url = urlFor(state.wall);
    el.src = url;
    document.documentElement.style.setProperty('--wall-img', `url("${url}")`);
    el.style.setProperty('--wall-zoom', state.wall === 'custom' ? 1 : 1);
    document.body.style.setProperty('--wall-zoom', '1');
  }

  return { apply, urlFor, thumb, PRESETS };
})();

/* ============================================================================
   4. ADAPTIVE COLOR — keeps text readable on any wallpaper
   ========================================================================= */
const Adaptive = (() => {
  const cv = document.createElement('canvas');
  cv.width = 24; cv.height = 24;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  let lastLight = null;

  function sample() {
    const img = $('wall');
    try {
      ctx.drawImage(img, 0, 0, 24, 24);
      const d = ctx.getImageData(0, 0, 24, 24).data;
      let lum = 0, r = 0, g = 0, b = 0;
      for (let i = 0; i < d.length; i += 4) {
        r += d[i]; g += d[i+1]; b += d[i+2];
        lum += (0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2]) / 255;
      }
      const n = d.length / 4;
      lum /= n; r /= n; g /= n; b /= n;
      // hysteresis so the UI never flickers between the two states
      if (lastLight === null) lastLight = lum > 0.52;
      else if (!lastLight && lum > 0.56) lastLight = true;
      else if (lastLight && lum < 0.44) lastLight = false;

      const root = document.documentElement.style;
      const ink = lastLight ? '#12151c' : '#ffffff';
      root.setProperty('--ui', ink);
      root.setProperty('--ui-dim', lastLight ? 'rgba(18,21,28,.66)' : 'rgba(255,255,255,.74)');
      root.setProperty('--glass-bg', lastLight ? 'rgba(255,255,255,.34)' : 'rgba(255,255,255,.10)');
      root.setProperty('--clock-top', ink);

      // Clock tint: smoked glass on light walls, milky on dark walls
      let a1, a2, base;
      if (state.color === 'auto') {
        a1 = lastLight ? 0.70 : 0.52;
        a2 = lastLight ? 0.42 : 0.24;
        base = lastLight ? [14, 18, 26] : [255, 255, 255];
      } else {
        base = hexToRgb(state.color);
        a1 = 0.58; a2 = 0.26;
      }
      root.setProperty('--clock-tint',
        `linear-gradient(180deg, rgba(${base[0]},${base[1]},${base[2]},${a1}) 0%, rgba(${base[0]},${base[1]},${base[2]},${a2}) 100%)`);
    } catch (e) { /* cross-origin or not ready */ }
  }

  return { sample };
})();

/* ============================================================================
   5. MEDIA (now playing + real audio if the user picks a file)
   ========================================================================= */
const Media = (() => {
  const audio = new Audio();
  let hasFile = false;
  let raf = 0;
  let demoStart = 0;

  function fmt(t) {
    t = Math.max(0, Math.floor(t));
    return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
  }

  function position() {
    if (hasFile) return audio.currentTime;
    if (!state.playing) return state.np.elapsed;
    return state.np.elapsed + (performance.now() - demoStart) / 1000;
  }

  /* Marquee measurement forces a layout, so it runs only when the song
     changes — never inside the 60 fps progress loop. */
  function measureTitle() {
    const title = $('np-title');
    const over = title.scrollWidth > title.clientWidth + 2;
    title.classList.toggle('scroll', over);
    if (over) title.style.setProperty('--mq', `-${title.scrollWidth - title.clientWidth + 18}px`);
  }

  /* Progress only: touches the numbers when they actually change. */
  let lastElapsed = '', lastRemain = '';
  const thumbEl = $('np-thumb');
  const trackEl = document.querySelector('#np-bar .np-track');

  /* The bar's pixel width, cached — needed once, not every frame. */
  function measureBar() {
    const w = trackEl ? trackEl.clientWidth : 300;
    if (w > 0) thumbEl.style.setProperty('--bar-w', w + 'px');
  }
  function renderProgress() {
    const dur = state.np.duration || 1;
    const pos = position();
    const p = clamp01(pos / dur);
    $('np-fill').style.transform = `scaleX(${p.toFixed(4)})`;
    thumbEl.style.left = (p * 100).toFixed(3) + '%';
    const e = fmt(pos), r = '-' + fmt(dur - pos);
    if (e !== lastElapsed) { $('np-elapsed').textContent = e; lastElapsed = e; }
    if (r !== lastRemain) { $('np-remain').textContent = r; lastRemain = r; }
  }

  function render() {
    measureBar();
    $('np-title').textContent = state.np.title;
    $('np-artist').textContent = state.np.artist;
    $('np-play').classList.toggle('playing', !!state.playing);
    measureTitle();
    renderProgress();
  }

  /* The bar moves roughly one pixel per second, so repainting it 60×/s is
     pure waste inside a backdrop-filter card: 8 updates a second look
     perfectly smooth and keep the whole screen at 60 fps. */
  let lastPaint = 0;
  function tick(now) {
    if (!lastPaint || (now || performance.now()) - lastPaint >= 120) {
      lastPaint = (now || performance.now());
      renderProgress();
    }
    if (state.playing) raf = requestAnimationFrame(tick);
    else raf = 0;
  }

  function play() {
    state.playing = true;
    if (hasFile) audio.play().catch(() => {});
    else demoStart = performance.now();
    save();
    render();
    if (!raf) raf = requestAnimationFrame(tick);
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: state.np.title, artist: state.np.artist });
    }
  }
  function pause() {
    state.playing = false;
    if (hasFile) { audio.pause(); state.np.elapsed = audio.currentTime; }
    else state.np.elapsed = Math.min(state.np.duration, position());
    save();
    render();
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }
  function toggle() { state.playing ? pause() : play(); }

  /* A tiny queue so «التالي / السابق» actually change the track — with a
     springy swap of the artwork and the title. */
  const QUEUE = [
    { title: 'Grown Woman', artist: 'Beyoncé', duration: 315 },
    { title: 'Midnight City', artist: 'M83', duration: 243 },
    { title: 'Nights', artist: 'Frank Ocean', duration: 307 },
    { title: 'Let It Happen', artist: 'Tame Impala', duration: 467 },
    { title: 'Telepatía', artist: 'Kali Uchis', duration: 180 }
  ];
  let qi = 0;
  const idxOf = () => {
    const j = QUEUE.findIndex(t => t.title === state.np.title);
    return j < 0 ? 0 : j;
  };

  function swapTo(i, dir) {
    qi = (i + QUEUE.length) % QUEUE.length;
    const t = QUEUE[qi];
    state.np.title = t.title;
    state.np.artist = t.artist;
    state.np.duration = t.duration;
    state.np.elapsed = 0;
    if (hasFile) { audio.pause(); audio.src = ''; hasFile = false; }
    demoStart = performance.now();
    const card = $('np');
    card.classList.remove('track-swap');
    void card.offsetWidth;
    card.classList.add('track-swap');
    setTimeout(() => card.classList.remove('track-swap'), 600);
    // the artwork swatches shift per track, so the swap is visible
    const art = $('np-art');
    art.style.background = ART_GRADIENTS[qi % ART_GRADIENTS.length];
    art.removeAttribute('src');
    render();
    save();
    if (state.playing) play(); else render();
    if (dir) {
      const b = dir > 0 ? $('np-next') : $('np-prev');
      b.classList.remove('nudge-r', 'nudge-l');
      void b.offsetWidth;
      b.classList.add(dir > 0 ? 'nudge-r' : 'nudge-l');
      setTimeout(() => b.classList.remove('nudge-r', 'nudge-l'), 500);
    }
  }
  const ART_GRADIENTS = [
    'linear-gradient(135deg,#ff5f6d,#ffc371)',
    'linear-gradient(135deg,#5f72ff,#8ef0ff)',
    'linear-gradient(135deg,#7a5fff,#ff8ad1)',
    'linear-gradient(135deg,#ff9a3c,#ffd93d)',
    'linear-gradient(135deg,#22c1c3,#7bffd0)'
  ];
  function nextTrack() { swapTo(idxOf() + 1, 1); vib(9); }
  function prevTrack() {
    // iPhone rule: restart the song unless you are already at the top
    if (position() > 3) { seek(0); }
    else swapTo(idxOf() - 1, -1);
    vib(9);
  }
  function seek(p) {
    const t = clamp01(p) * state.np.duration;
    if (hasFile) audio.currentTime = t;
    state.np.elapsed = t;
    demoStart = performance.now();
    render();
    save();
  }

  function loadFile(file) {
    const url = URL.createObjectURL(file);
    audio.src = url;
    audio.load();
    hasFile = true;
    audio.addEventListener('ended', () => {
      state.playing = false; state.np.elapsed = 0; render();
    }, { once: true });
    audio.addEventListener('loadedmetadata', () => {
      if (isFinite(audio.duration) && audio.duration > 0) state.np.duration = audio.duration;
      render();
    }, { once: true });
    $('np-title').textContent = file.name.replace(/\.[^.]+$/, '');
    state.np.title = file.name.replace(/\.[^.]+$/, '');
    play();
  }
  function loadArt(file) {
    const r = new FileReader();
    r.onload = () => { $('np-art').src = r.result; };
    r.readAsDataURL(file);
  }

  // scrub
  const bar = $('np-bar');
  let scrubbing = false;
  const at = (clientX) => {
    const r = bar.getBoundingClientRect();
    return (clientX - r.left) / r.width;
  };
  bar.addEventListener('pointerdown', (e) => {
    scrubbing = true; bar.classList.add('scrub');
    bar.setPointerCapture(e.pointerId); seek(at(e.clientX)); vib(5);
  });
  bar.addEventListener('pointermove', (e) => { if (scrubbing) seek(at(e.clientX)); });
  const endScrub = () => { scrubbing = false; bar.classList.remove('scrub'); };
  bar.addEventListener('pointerup', endScrub);
  bar.addEventListener('pointercancel', endScrub);

  function bump(btn) {
    btn.classList.remove('nudge');
    void btn.offsetWidth;
    btn.classList.add('nudge');
    setTimeout(() => btn.classList.remove('nudge'), 500);
  }
  $('np-play').addEventListener('click', () => { toggle(); bump($('np-play')); vib(7); });
  $('np-prev').addEventListener('click', prevTrack);
  $('np-next').addEventListener('click', nextTrack);
  $('np-star').addEventListener('click', () => { bump($('np-star')); toast('أُضيفت إلى المفضلة'); vib(7); });
  $('np-air').addEventListener('click', () => { bump($('np-air')); toast('AirPlay: مكبّر صوت iPhone'); vib(7); });

  return { render, play, pause, tick, loadFile, loadArt, seek, nextTrack, prevTrack, measureTitle, measureBar,
           isPlaying: () => !!state.playing };
})();

/* ============================================================================
   6. SHORTCUTS — hold 350ms, tap = on/off, both springy
   ========================================================================= */
const Shortcuts = (() => {
  const flash = $('flash');
  let camStream = null;

  /* No progress ring anymore — the button itself is the feedback: it sinks
     as you hold and pops back with a spring when the hold fires. */
  function pop(btn) {
    btn.classList.remove('pop');
    void btn.offsetWidth;
    btn.classList.add('pop');
    setTimeout(() => btn.classList.remove('pop'), 560);
  }

  /* iPhone lock-screen behaviour:
     · a quick tap turns the flashlight on/off (it never "opens")
     · holding 350ms fills the ring, fires haptics and lets go with a spring
     · the camera button taps into the camera, and a long press snaps a photo
       with the iOS shutter flash — exactly like holding it on a real iPhone. */
  function bind(btn, { onTap, onHold }) {
    let t0 = 0, raf = 0, fired = false;
    const start = (e) => {
      e.preventDefault();
      fired = false;
      btn.classList.add('charging');
      t0 = performance.now();
      vib(4);
      const step = () => {
        const p = Math.min(1, (performance.now() - t0) / 350);
        // press-sink eases in as the hold builds
        btn.style.transform = `scale(${(0.9 - 0.02 * p).toFixed(3)})`;
        if (p < 1) { raf = requestAnimationFrame(step); return; }
        // hold completed: fire exactly once, then spring back
        raf = 0;
        if (!fired) {
          fired = true;
          vib(22);
          if (navigator.vibrate) { try { navigator.vibrate([0, 18, 40, 18]); } catch (_) {} }
          if (onHold) onHold();
        }
        btn.classList.remove('charging');
        btn.style.transform = '';
        pop(btn);
      };
      raf = requestAnimationFrame(step);
    };
    const cancel = () => {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      btn.classList.remove('charging');
      btn.style.transform = '';
    };
    const end = () => {
      const held = performance.now() - t0;
      cancel();
      if (!fired && held < 350) {
        vib(9);
        pop(btn);            // springy pop for the short tap too
        if (onTap) onTap();
      }
      fired = false;
    };
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', end);
    btn.addEventListener('pointercancel', cancel);
    btn.addEventListener('pointerleave', cancel);
  }

  function bindAll() {
    bind($('sh-left'), {
      onTap: () => {
        const on = flash.classList.toggle('on');
        $('sh-left').classList.toggle('on', on);
        if (on) vib(14);
      },
      onHold: () => {
        // hold = quick flash pulse, like the torch burst
        flash.classList.add('on');
        $('sh-left').classList.add('on');
        setTimeout(() => {
          flash.classList.remove('on');
          $('sh-left').classList.remove('on');
        }, 420);
      }
    });
    bind($('sh-right'), {
      onTap: () => openCamera(),
      onHold: () => {
        openCamera();
        // let the sheet and iris settle first, then fire the shutter
        setTimeout(shoot, 620);
      }
    });
  }

  /* iOS-style shutter: white flash + iris dip + haptic. */
  function shoot() {
    const sh = $('shutter');
    const iris = $('cam-iris');
    if (!sh) return;
    sh.style.transition = 'none';
    sh.style.opacity = '1';
    if (iris) { iris.style.transition = 'none'; iris.style.opacity = '0'; }
    vib(16);
    // hold the white for one frame, then let it drain (two frames so the
    // browser commits the "on" state before the fade starts)
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        sh.style.transition = 'opacity .46s cubic-bezier(.32,.72,0,1)';
        sh.style.opacity = '0';
        if (iris) {
          iris.style.transition = 'opacity .45s ease';
          iris.style.opacity = '1';
        }
      });
    });
    toast('تم التقاط الصورة');
  }
  $('cam-shutter').addEventListener('click', shoot);

  function openCamera() {
    $('cam').classList.add('on');
    const v = $('cam-video');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('cam-msg').style.display = 'block';
      v.style.display = 'none';
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then((s) => {
        if (document.hidden || !$('cam').classList.contains('on')) { s.getTracks().forEach(t => t.stop()); return; }
        camStream = s; v.srcObject = s; v.play().catch(() => {});
      })
      .catch(() => { $('cam-msg').style.display = 'block'; v.style.display = 'none'; });
  }
  function closeCamera() {
    $('cam').classList.remove('on');
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
    $('cam-video').srcObject = null;
  }

  $('flash-off').addEventListener('click', () => {
    flash.classList.remove('on');
    $('sh-left').classList.remove('on');
  });
  $('cam-close').addEventListener('click', closeCamera);

  return { bindAll, closeCamera };
})();

function vib(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ============================================================================
   7. LOCK SCREEN STAYS LOCKED — no unlock animation.
   A very light rubber-band on a downward pull only, then a clean snap back,
   so the surface still feels alive without ever leaving the lock screen.
   ========================================================================= */
const Pull = (() => {
  const screen = $('screen');
  const clockLayer = $('clock-layer');
  const top = $('topline');
  const np = $('np');
  const bottom = $('bottom');
  let drag = null;
  let springRaf = 0;
  let pullY = 0;

  screen.addEventListener('pointerdown', (e) => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (Editor.isOpen()) return;
    cancelAnimationFrame(springRaf);
    if ($('cam').classList.contains('on') || $('flash').classList.contains('on')) return;
    if (e.target.closest('#np, #bottom, #edit, #clock-wrap, #clock-frame, #cam, #flash, button')) return;
    drag = { y: e.clientY, t: performance.now(), last: e.clientY, id: e.pointerId, armed: false };
  });

  screen.addEventListener('pointermove', (e) => {
    if (!drag) return;
    drag.last = e.clientY;
    const dy = e.clientY - drag.y;
    if (dy < 8) return;                     // only a real downward pull responds
    if (!drag.armed) {                      // claim the pointer only once it moves
      drag.armed = true;
      try { screen.setPointerCapture(drag.id); } catch (_) {}
    }
    // rubber band: 26% of the finger, hard-capped so nothing ever leaves
    const y = pullY = 150 * (1 - Math.exp(-Math.max(0, dy - 8) / 500));
    clockLayer.style.transform = `translate3d(0,${y}px,0)`;
    top.style.transform = `translate3d(0,${y}px,0)`;
    np.style.transform = `translate3d(0,${y * 0.6}px,0)`;
    bottom.style.transform = `translate3d(0,${y * 0.4}px,0)`;
  });

  const settle = () => {
    if (!drag) return;
    const wasArmed = drag.armed;
    drag = null;
    if (!wasArmed) {                       // a tap: nothing moved, nothing to settle
      clockLayer.style.transform = top.style.transform = '';
      np.style.transform = bottom.style.transform = '';
      return;
    }
    // one tidy spring back
    const t0 = performance.now();
    const fromY = pullY;
    const step = (now) => {
      const k = Math.min(1, (now - t0) / 620);
      const y = fromY * Math.exp(-7 * k) * Math.cos(10 * k);
      clockLayer.style.transform = `translate3d(0,${y}px,0)`;
      top.style.transform = `translate3d(0,${y}px,0)`;
      np.style.transform = `translate3d(0,${y * 0.6}px,0)`;
      bottom.style.transform = `translate3d(0,${y * 0.4}px,0)`;
      if (k < 1) springRaf = requestAnimationFrame(step);
      else {                              // wipe the inline styles so layout is pristine
        clockLayer.style.transform = top.style.transform = '';
        np.style.transform = bottom.style.transform = '';
      }
    };
    springRaf = requestAnimationFrame(step);
  };
  screen.addEventListener('pointerup', settle);
  screen.addEventListener('pointercancel', settle);
})();

  /* Inner-shadow sliders — they write CONFIG.glass.inner only, so the music

                        '#ff9ecb', '#ffd60a', '#ff9f6b', '#8ef0c4', '#b9b9bf', '#1c1c1e'];

  function innerCtl() {
